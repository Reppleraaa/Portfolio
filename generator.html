<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generator Hasał</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .box { background: #1e293b; padding: 24px; border-radius: 12px; width: 300px; text-align: center; border: 1px solid #334155; }
    h2 { color: #10b981; margin-top: 0; }
    .out { background: #0f172a; padding: 12px; border-radius: 6px; border: 1px solid #475569; word-break: break-all; margin: 15px 0; min-height: 20px; font-family: monospace; color: #34d399; }
    button { width: 100%; padding: 10px; background: #10b981; border: none; color: #000; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 5px; }
    button:hover { background: #059669; }
  </style>
</head>
<body>
  <div class="box">
    <h2>GenHasło</h2>
    <div class="out" id="pass">Kliknij generuj</div>
    <button onclick="gen()">Generuj hasło</button>
    <button onclick="copy()" style="background:#475569; color:#fff;">Kopiuj</button>
  </div>

  <script>
    function gen() {
      const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()";
      let res = "";
      for (let i = 0; i < 12; i++) {
        res += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      document.getElementById('pass').innerText = res;
    }
    function copy() {
      const p = document.getElementById('pass').innerText;
      if (p && p !== "Kliknij generuj") {
        navigator.clipboard.writeText(p);
        alert("Skopiowano do schowka!");
      }
    }
  </script>
</body>
</html>
